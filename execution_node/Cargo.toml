[package]
name = "execution_node"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket — rustls-tls-webpki-roots: pure-Rust TLS with bundled Mozilla CA roots.
# Identical to mammond/project_sniper. No system CA store needed.
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Redis
redis = { version = "0.25", features = ["tokio-comp", "aio"] }

# PostgreSQL — same as mammond (tokio-postgres, not sqlx)
tokio-postgres = "0.7"

# HTTP REST client — reqwest 0.12 with pure rustls, no OpenSSL, no default features.
# Identical to mammond/project_sniper which has proven connectivity to Binance.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# HMAC-SHA256 request signing
hmac = "0.12"
sha2 = "0.10"
hex  = "0.4"

# Utilities
anyhow  = "1"
dotenvy = "0.15"
chrono  = { version = "0.4", features = ["serde"] }
url     = "2"

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
