# docker-compose.yml — Mammon unified stack (Engine D + Agent Q)
# Renamed from docker-compose.hft.yml per PRD §Phase 1 (legacy A/B/C engines deleted).
#
# Run with:  docker compose build && docker compose up -d
#
# Spins up exactly 6 containers:
#   1. postgres           — TimescaleDB (trade_telemetry)
#   2. redis              — Redis 7 (live params + regime pub/sub)
#   3. dashboard_backend  — Express REST API
#   4. dashboard_frontend — React + nginx
#   5. agent_0_ingestion  — Rust HFT Engine D (Avellaneda-Stoikov market maker)
#   6. agent_q_optimizer  — Python dual-loop LLM optimizer (Oracle 5m + Tactical 15m)
#
# Agents A / B / C have been deleted — this stack is Engine D only.
#
# Security notes:
#   • Redis requires password auth (REDIS_PASSWORD in .env).
#   • REDIS_URL carries credentials: redis://:${REDIS_PASSWORD}@redis:6379
#     — the URL is never logged by agent_0 (see main.rs).
#   • All secrets flow from .env only — that file is gitignored.

version: "3.9"

networks:
  mammon_net:
    driver: bridge

volumes:
  redis_data:
  postgres_data:

services:

  # ── Shared infrastructure ───────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: mammon_redis
    networks: [mammon_net]
    ports:
      - "6379:6379"
    # Require password auth — rejects unauthenticated connections on the network.
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    healthcheck:
      # Pass -a so the health-check itself can authenticate.
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    build: ./database_schema      # bakes init_db.sql into the image (avoids macOS bind-mount deadlock)
    container_name: mammon_postgres
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-mammon}
      POSTGRES_USER:     ${POSTGRES_USER:-mammon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mammon}
    networks: [mammon_net]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mammon} -d ${POSTGRES_DB:-mammon}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Engine D — Rust HFT ingestion binary ────────────────────────────────────

  agent_0_ingestion:
    build: ./agent_0_ingestion
    container_name: mammon_agent0
    networks: [mammon_net]
    # ISP DNS poisons api.binance.com / stream.binance.com → use Google/CF DNS.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      # Redis URL includes password so agent_0 authenticates on connect.
      REDIS_URL:          redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      # DB_DSN wires Engine D → PostgreSQL for live trade_telemetry writes (Phase 2).
      DB_DSN:             postgresql://${POSTGRES_USER:-mammon}:${POSTGRES_PASSWORD:-mammon}@postgres:5432/${POSTGRES_DB:-mammon}
      BINANCE_API_KEY:    ${BINANCE_API_KEY}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET}
      RUST_LOG: info
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Dashboard (Engine D telemetry) ──────────────────────────────────────────

  dashboard_backend:
    build: ./agent_dashboard/backend
    container_name: mammon_backend
    networks: [mammon_net]
    ports:
      - "4000:4000"
    environment:
      DB_DSN:    postgresql://${POSTGRES_USER:-mammon}:${POSTGRES_PASSWORD:-mammon}@postgres:5432/${POSTGRES_DB:-mammon}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      PORT:      "4000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard_frontend:
    build: ./agent_dashboard/frontend
    container_name: mammon_frontend
    networks: [mammon_net]
    ports:
      - "3000:80"
    depends_on:
      - dashboard_backend
    restart: unless-stopped

  # ── Agent Q — Autonomous Quant Optimizer ────────────────────────────────────

  agent_q_optimizer:
    build: ./agent_q_optimizer
    container_name: mammon_agent_q
    networks: [mammon_net]
    # Allows the container to reach LM Studio on the host at port 1234.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Redis URL must carry password to match redis requirepass config.
      REDIS_URL:           redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      DB_DSN:              postgresql://${POSTGRES_USER:-mammon}:${POSTGRES_PASSWORD:-mammon}@postgres:5432/${POSTGRES_DB:-mammon}
      LM_STUDIO_URL:       http://host.docker.internal:1234/v1
      LM_STUDIO_MODEL_1:   llama-3.2-3b-instruct    # Oracle + Agent 1 Alpha (proposing)
      LM_STUDIO_MODEL_2:   llama-3.2-3b-instruct:2  # Agent 2 CRO (auditing, runs in parallel)
      ACTIVE_SYMBOLS:      ADAFDUSD,DOTFDUSD,DOGEFDUSD,XRPFDUSD
      ORACLE_INTERVAL_S:   "300"    # Oracle regime classifier — every 5 min
      TACTICAL_INTERVAL_S: "900"    # Tactical parameter tuner — every 15 min
      PYTHONUNBUFFERED:    "1"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
