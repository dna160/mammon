# docker-compose.yml — Mammon unified stack (Engine D + Agent Q)
#
# Run with:  docker compose build && docker compose up -d
#
# Spins up exactly 6 containers:
#   1. postgres           — TimescaleDB (trade_telemetry)
#   2. redis              — Redis 7 (live params + regime pub/sub)
#   3. dashboard_backend  — Express REST API
#   4. dashboard_frontend — React + nginx
#   5. agent_0_ingestion  — Rust HFT Engine D
#   6. agent_q_optimizer  — Python dual-loop LLM optimizer (Oracle 5m + Tactical 15m)
#
# Security notes:
#   • Redis requires password auth (REDIS_PASSWORD in .env).
#   • All secrets flow from .env only — that file is gitignored.

version: "3.9"

networks:
  mammon_net:
    driver: bridge

volumes:
  redis_data:
  postgres_data:

services:

  # ── Shared infrastructure ───────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: mammon_redis
    networks: [mammon_net]
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: mammon_postgres
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-mammon}
      POSTGRES_USER:     ${POSTGRES_USER:-mammon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mammon}
    networks: [mammon_net]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database_schema/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mammon} -d ${POSTGRES_DB:-mammon}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Engine D — Rust HFT ingestion binary ────────────────────────────────────

  agent_0_ingestion:
    build: ./agent_0_ingestion
    container_name: mammon_agent0
    networks: [mammon_net]
    # ISP DNS poisons api.binance.com / stream.binance.com → use Google/CF DNS.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      REDIS_URL:          redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      DB_DSN:             postgresql://${POSTGRES_USER:-mammon}:${POSTGRES_PASSWORD:-mammon}@postgres:5432/${POSTGRES_DB:-mammon}
      BINANCE_API_KEY:    ${BINANCE_API_KEY}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET}
      RUST_LOG: info
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Dashboard ────────────────────────────────────────────────────────────────

  dashboard_backend:
    build: ./agent_dashboard/backend
    container_name: mammon_backend
    networks: [mammon_net]
    ports:
      - "4000:4000"
    environment:
      DB_DSN: postgresql://${POSTGRES_USER:-mammon}:${POSTGRES_PASSWORD:-mammon}@postgres:5432/${POSTGRES_DB:-mammon}
      PORT: "4000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard_frontend:
    build: ./agent_dashboard/frontend
    container_name: mammon_frontend
    networks: [mammon_net]
    ports:
      - "3000:80"
    volumes:
      - ./agent_dashboard/frontend/nginx.hft.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dashboard_backend
    restart: unless-stopped

  # ── Agent Q — Autonomous Quant Optimizer ────────────────────────────────────

  agent_q_optimizer:
    build: ./agent_q_optimizer
    container_name: mammon_agent_q
    networks: [mammon_net]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDIS_URL:           redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      DB_DSN:              postgresql://${POSTGRES_USER:-mammon}:${POSTGRES_PASSWORD:-mammon}@postgres:5432/${POSTGRES_DB:-mammon}
      LM_STUDIO_URL:       http://host.docker.internal:1234/v1
      LM_STUDIO_MODEL_1:   llama-3.2-3b-instruct    # Oracle + Alpha Quant
      LM_STUDIO_MODEL_2:   llama-3.2-3b-instruct:2  # CRO (parallel to model 1)
      ACTIVE_SYMBOLS:      ADAFDUSD,DOTFDUSD,DOGEFDUSD,XRPFDUSD
      ORACLE_INTERVAL_S:   "300"
      TACTICAL_INTERVAL_S: "900"
      PYTHONUNBUFFERED:    "1"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
