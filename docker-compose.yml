# ── Mammon V3 HFT Stack ──────────────────────────────────────────────────────
# Boots Postgres, Redis, Rust Execution Node, and Python Cognitive Node.
# Run with: docker compose up --build

services:
  # ── PostgreSQL (The Hippocampus) ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mammon_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Redis (Shared Memory Bus) ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mammon_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Rust Execution Node (The Sniper) ──────────────────────────────────────
  execution_node:
    build:
      context: ./execution_node
      dockerfile: Dockerfile
    container_name: mammon_rust
    env_file: .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Python Cognitive Node (Agent Q) ──────────────────────────────────────
  cognitive_node:
    build:
      context: ./cognitive_node
      dockerfile: Dockerfile
    container_name: mammon_python
    env_file: .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # LM Studio running on host machine — use host.docker.internal
      LM_STUDIO_URL: http://host.docker.internal:1234
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres_data:
    driver: local
