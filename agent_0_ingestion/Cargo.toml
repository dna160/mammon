[package]
name = "agent_0_ingestion"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
# rustls-tls-webpki-roots: pure-Rust TLS with bundled Mozilla CA roots.
# Guarantees cert verification in minimal Docker images (no system CA store needed).
# Replaces native-tls / OpenSSL to eliminate system-library TLS dependency.
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
redis = { version = "0.25", features = ["tokio-comp", "aio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
anyhow = "1"
url = "2"
# REST client for Binance Spot V3 order execution (rustls — no OpenSSL).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# HMAC-SHA256 request signing.
hmac  = "0.12"
sha2  = "0.10"
hex   = "0.4"
